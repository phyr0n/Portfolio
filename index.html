<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adam Tait's software engineer portfolio." />
    <title>Adam Tait — Software Engineer</title>
    <script>
      // Theming, it is here to avoid awful flashes.
      (function () {
        try {
          var stored = localStorage.getItem('theme');

          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          }
          // If we can't find a saved theme, we default to the user's system preference.
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
          else {
            theme = 'light';
          }

          document.documentElement.setAttribute('data-theme', theme);

        } catch (e) {
          // We'll default to light mode if an error occurs.
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      /* Default colour to show before the .css file loads. Make sure to keep these background colours in sync in global.css. */
      html { background: #ffffff; }
      html[data-theme='dark'] { background: #0a0a0a; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
